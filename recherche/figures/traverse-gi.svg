<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 428" width="920" height="428" role="img"><rect width="920" height="428" fill="#f4f1ea"/><text x="28.00" y="32.00" font-family="sans-serif" font-size="15.0" fill="#1a1815" text-anchor="start" font-weight="600">L'ordre de grandeur qui ferme une famille entière</text><text x="28.00" y="52.00" font-family="sans-serif" font-size="11.5" fill="#9c9488" text-anchor="start">La GI stochastique mesurée par des gens dont c'est le métier, contre notre budget total.</text><rect x="330.00" y="108.00" width="306.67" height="34.00" fill="#8c3b2e"/><text x="646.67" y="131.00" font-family="sans-serif" font-size="14.0" fill="#8c3b2e" text-anchor="start" font-weight="600">10,0 ms</text><text x="318.00" y="124.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="end" font-weight="600">GI diffuse SEULE — Traverse</text><text x="318.00" y="142.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="end">Adreno 840 (2026) · lancer de rayons</text><text x="318.00" y="154.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="end">MATÉRIEL · 1 œil · 1170×540, GI tracée au</text><text x="318.00" y="166.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="end">quart · 27 im/s</text><rect x="330.00" y="204.00" width="426.27" height="34.00" fill="#2f5d62"/><text x="766.27" y="227.00" font-family="sans-serif" font-size="14.0" fill="#2f5d62" text-anchor="start" font-weight="600">13,9 ms</text><text x="318.00" y="220.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="end" font-weight="600">notre budget TOTAL</text><text x="318.00" y="238.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="end">Adreno 650 (2020) · sans lancer de rayons</text><text x="318.00" y="250.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="end">· 2 yeux · 72 Hz · tout compris</text><line x1="330.00" y1="100.00" x2="330.00" y2="296.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><line x1="330.00" y1="296.00" x2="330.00" y2="301.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="330.00" y="315.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="middle">0 ms</text><line x1="483.33" y1="296.00" x2="483.33" y2="301.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="483.33" y="315.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="middle">5 ms</text><line x1="636.67" y1="296.00" x2="636.67" y2="301.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="636.67" y="315.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="middle">10 ms</text><line x1="790.00" y1="296.00" x2="790.00" y2="301.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="790.00" y="315.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="middle">15 ms</text><text x="28.00" y="344.00" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="start">Le meilleur GPU mobile de 2026, avec du lancer de rayons matériel, à un onzième de notre nombre de</text><text x="28.00" y="359.00" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="start">pixels, pour UN œil, dépense les trois quarts de tout notre budget rien qu'en lumière indirecte diffuse —</text><text x="28.00" y="374.00" font-family="sans-serif" font-size="11.0" fill="#8c3b2e" text-anchor="start">et n'atteint pas trente images par seconde.</text><text x="28.00" y="414.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">LU chez quelqu'un · J. de Winther, « Towards Real-time Dynamic GI on Mobile », Moving Mobile Graphics, SIGGRAPH 2026</text></svg>