l="#8c3b2e" text-anchor="start">lectures de Newton — ni la passe</text><text x="664.00" y="195.00" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">qui produit la carte des faces</text><text x="664.00" y="209.50" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">arrière, ni le reste de l'image.</text><text x="664.00" y="232.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">Le vrai coût est donc plus élevé</text><text x="664.00" y="246.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">que ces courbes, et l'écart</text><text x="664.00" y="261.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">n'est pas chiffré.</text><text x="664.00" y="283.50" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">Diviser le format par deux</text><text x="664.00" y="298.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">double la surface de verre qu'on</text><text x="664.00" y="312.50" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">peut se permettre. C'est le</text><text x="664.00" y="327.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">genre d'arbitrage que la bande</text><text x="664.00" y="341.50" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">passante impose, et le calcul,</text><text x="664.00" y="356.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">lui, ne bouge pas.</text><text x="28.00" y="426.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">CALCULÉ · lectures MESURÉES (3,28/pixel) × budget CALCULÉ de seconde main (87 o/pixel, dont 10 % accordés ici)</text></svg>