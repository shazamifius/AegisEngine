inecap="round"/><text x="342.00" y="370.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">256²</text><line x1="542.00" y1="350.00" x2="542.00" y2="355.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="542.00" y="370.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">512²</text><line x1="82.00" y1="350.00" x2="602.00" y2="350.00" stroke="#1a1815" stroke-width="1.2" stroke-linecap="round"/><line x1="82.00" y1="82.00" x2="82.00" y2="350.00" stroke="#1a1815" stroke-width="1.2" stroke-linecap="round"/><line x1="82.00" y1="316.29" x2="602.00" y2="316.29" stroke="#2f5d62" stroke-width="1.2" stroke-dasharray="5 4"/><text x="92.00" y="308.29" font-family="sans-serif" font-size="10.5" fill="#2f5d62" text-anchor="start">1,789° — le shader calcule sa sphère lui-même</text><line x1="82.00" y1="323.20" x2="602.00" y2="323.20" stroke="#4a6b3a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="92.00" y="339.20" font-family="sans-serif" font-size="10.5" fill="#4a6b3a" text-anchor="start">1,740° — le banc processeur, la même vérité</text><polyline points="142.00,121.78 342.00,267.91 542.00,298.23" fill="none" stroke="#7d4b2a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="142.00" cy="121.78" r="6.10" fill="#f4f1ea"/><circle cx="142.00" cy="121.78" r="4.50" fill="#7d4b2a"/><text x="142.00" y="106.78" font-family="sans-serif" font-size="11.5" fill="#7d4b2a" text-anchor="middle" font-weight="600">3,168°</text><text x="142.00" y="143.78" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="middle">2 584 px de verre</text><circle cx="342.00" cy="267.91" r="6.10" fill="#f4f1ea"/><circle cx="342.00" cy="267.91" r="4.50" fill="#7d4b2a"/><text x="342.00" y="252.91" font-family="sans-serif" font-size="11.5" fill="#7d4b2a" text-anchor="middle" font-weight="600">2,132°</text><text x="342.00" y="289.91" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="middle">10 280 px de verre</text><circle cx="542.00" cy="298.23" r="6.10" fill="#f4f1ea"/><circle cx="542.00" cy="298.23" r="4.50" fill="#7d4b2a"/><text x="542.00" y="283.23" font-family="sans-serif" font-size="11.5" fill="#7d4b2a" text-anchor="middle" font-weight="600">1,917°</text><text x="542.00" y="266.23" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="middle">41 140 px de verre</text><text x="342.00" y="394.00" font-family="sans-serif" font-size="11.5" fill="#9c9488" text-anchor="middle">résolution de la carte</text><text x="664.00" y="110.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">Le test n'exige AUCUN chiffre</text><text x="664.00" y="124.50" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">absolu — seulement la</text><text x="664.00" y="139.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">décroissance.</text><text x="664.00" y="161.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">Un seuil se périmerait à la</text><text x="664.00" y="176.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">première carte graphique</text><text x="664.00" y="190.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">différente ; une tendance, non.</text><text x="664.00" y="223.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">Et la sonde tranche : une faute</text><text x="664.00" y="237.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">de repère serait indifférente à</text><text x="664.00" y="252.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">la taille des pixels.</text><text x="28.00" y="426.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">MESURÉ le 4 sept. 2026 · test l_erreur_des_cartes_retrecit_avec_les_pixels_donc_c_est_bien_la_discretisation</text></svg>