<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" role="img"><rect width="920" height="370" fill="#f4f1ea"/><text x="28.00" y="32.00" font-family="sans-serif" font-size="15.0" fill="#1a1815" text-anchor="start" font-weight="600">Le poids du code — et ce qui dort dedans</text><text x="28.00" y="52.00" font-family="sans-serif" font-size="11.5" fill="#9c9488" text-anchor="start">Relu sur le disque le 4 septembre 2026 par « cargo run --example etat ». Ce bloc ne s'écrit plus à la main.</text><rect x="150.00" y="104.00" width="461.51" height="38.00" fill="#7d4b2a"/><rect x="611.51" y="104.00" width="64.64" height="38.00" fill="#9c9488"/><text x="138.00" y="126.00" font-family="sans-serif" font-size="13.0" fill="#1a1815" text-anchor="end" font-weight="600">moteur</text><text x="162.00" y="128.00" font-family="sans-serif" font-size="11.5" fill="#f4f1ea" text-anchor="start">18 955 lignes vivantes</text><text x="686.16" y="128.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="start">+ 2 655 endormies</text><text x="138.00" y="142.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="end">52 fichiers</text><rect x="150.00" y="186.00" width="378.39" height="38.00" fill="#7d4b2a"/><text x="138.00" y="208.00" font-family="sans-serif" font-size="13.0" fill="#1a1815" text-anchor="end" font-weight="600">jeu</text><text x="162.00" y="210.00" font-family="sans-serif" font-size="11.5" fill="#f4f1ea" text-anchor="start">15 541 lignes vivantes</text><text x="138.00" y="224.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="end">33 fichiers</text><text x="28.00" y="282.00" font-family="sans-serif" font-size="11.0" fill="#8c3b2e" text-anchor="start">⚠ Le JEU est presque aussi gros que le MOTEUR — ça contredit l'image d'un « moteur avec un petit jeu dessus ».</text><text x="28.00" y="298.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="start">25 fichiers dorment sous un préfixe « _ » : le compilateur ne les voit pas, git les garde entiers.</text><text x="28.00" y="314.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="start">Ils portent de vraies formules testées — réservoir ReSTIR, WBOIT/MBOIT, LEAN — et zéro appel au GPU.</text><text x="28.00" y="330.00" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="start">Un fichier qui porte le nom d'une technique ne l'implémente pas. C'est le piège n° 1 de ce terrain.</text><text x="28.00" y="356.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">MESURÉ le 4 sept. 2026 · cargo run --release -p aegis_engine --example etat --no-default-features</text></svg>