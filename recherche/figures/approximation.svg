<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 402" width="920" height="402" role="img"><rect width="920" height="402" fill="#f4f1ea"/><text x="28.00" y="32.00" font-family="sans-serif" font-size="15.0" fill="#1a1815" text-anchor="start" font-weight="600">Ce que coûte l'approximation — et ce que Newton rattrape</text><text x="28.00" y="52.00" font-family="sans-serif" font-size="11.5" fill="#9c9488" text-anchor="start">Erreur moyenne sur la direction du rayon SORTANT, contre la vérité analytique d'une sphère.</text><rect x="290.00" y="102.00" width="409.51" height="28.00" fill="#8c3b2e"/><text x="278.00" y="121.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="end">le rayon ne dévie pas</text><text x="709.51" y="121.00" font-family="sans-serif" font-size="13.0" fill="#8c3b2e" text-anchor="start" font-weight="600">26,06°</text><rect x="290.00" y="150.00" width="243.10" height="28.00" fill="#8c3b2e"/><text x="278.00" y="169.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="end">avancer le long du dévié</text><text x="543.10" y="169.00" font-family="sans-serif" font-size="13.0" fill="#8c3b2e" text-anchor="start" font-weight="600">15,47°</text><rect x="290.00" y="198.00" width="178.67" height="28.00" fill="#a07b1e"/><text x="278.00" y="217.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="end">+ une itération</text><text x="478.67" y="217.00" font-family="sans-serif" font-size="13.0" fill="#a07b1e" text-anchor="start" font-weight="600">11,37°</text><rect x="290.00" y="246.00" width="27.34" height="28.00" fill="#4a6b3a"/><text x="278.00" y="265.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="end">Newton, quatre pas</text><text x="327.34" y="265.00" font-family="sans-serif" font-size="13.0" fill="#4a6b3a" text-anchor="start" font-weight="600">1,74°</text><line x1="290.00" y1="96.00" x2="290.00" y2="280.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="390.00" y="265.00" font-family="sans-serif" font-size="13.0" fill="#4a6b3a" text-anchor="start" font-weight="600">× 15,0 contre l'approximation</text><text x="28.00" y="312.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">L'approximation universelle du temps réel — « le rayon traverse tout droit » — se trompe</text><text x="28.00" y="327.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">de vingt-six degrés en moyenne sur une sphère. Sur toute l'image, elle atteint 36,4°.</text><text x="28.00" y="342.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">Ce chiffre-là a une histoire : le banc balayait UNE LIGNE d'écran et annonçait 1,8°.</text><text x="28.00" y="357.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">L'équateur est le cas le plus favorable de l'image. Le vrai chiffre est vingt fois pire.</text><text x="28.00" y="388.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">MESURÉ le 4 sept. 2026 · tests l_erreur_de_l_approximation_a_deux_interfaces et les_trois_images_de_la_bille…</text></svg>