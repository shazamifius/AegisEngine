xt x="44.00" y="467.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="end">16</text><text x="56.00" y="467.00" font-family="sans-serif" font-size="13.0" fill="#4a6b3a" text-anchor="start">●</text><text x="78.00" y="467.00" font-family="sans-serif" font-size="11.5" fill="#1a1815" text-anchor="start">Halo d'objectif</text><rect x="30.00" y="477.00" width="400.00" height="25.00" fill="#ebe6da"/><text x="44.00" y="492.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="end">17</text><text x="56.00" y="492.00" font-family="sans-serif" font-size="13.0" fill="#4a6b3a" text-anchor="start">●</text><text x="78.00" y="492.00" font-family="sans-serif" font-size="11.5" fill="#1a1815" text-anchor="start">Compression de dynamique</text><rect x="30.00" y="502.00" width="400.00" height="25.00" fill="#ebe6da"/><text x="44.00" y="517.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="end">18</text><text x="56.00" y="517.00" font-family="sans-serif" font-size="13.0" fill="#4a6b3a" text-anchor="start">●</text><text x="78.00" y="517.00" font-family="sans-serif" font-size="11.5" fill="#1a1815" text-anchor="start">Intégration sur le photosite</text><text x="440.00" y="479.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="end">l'appareil</text><text x="664.00" y="122.00" font-family="sans-serif" font-size="52.0" fill="#4a6b3a" text-anchor="start" font-weight="600">7</text><text x="706.00" y="122.00" font-family="sans-serif" font-size="20.0" fill="#9c9488" text-anchor="start">/ 18</text><text x="664.00" y="148.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="start">exprimés</text><circle cx="670.00" cy="186.00" r="5.00" fill="#4a6b3a"/><text x="686.00" y="190.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="start">7 exprimés</text><circle cx="670.00" cy="212.00" r="5.00" fill="#a07b1e"/><text x="686.00" y="216.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="start">2 partiels</text><circle cx="670.00" cy="238.00" r="5.00" fill="#9c9488"/><text x="686.00" y="242.00" font-family="sans-serif" font-size="12.0" fill="#1a1815" text-anchor="start">9 absents</text><text x="664.00" y="294.00" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">⚠ Et le chiffre ment si on</text><text x="664.00" y="308.50" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">s'arrête là : aucun des quatre</text><text x="664.00" y="323.00" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">phénomènes de matière n'est dans</text><text x="664.00" y="337.50" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">une image du JEU.</text><text x="664.00" y="360.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">Ils vivent dans une passe</text><text x="664.00" y="374.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">exercée par ses seuls tests. Un</text><text x="664.00" y="389.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">phénomène « exprimé » que</text><text x="664.00" y="403.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">personne ne voit reste, pour le</text><text x="664.00" y="418.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">joueur, un phénomène absent.</text><text x="664.00" y="440.50" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">Le 31 août, ils étaient trois —</text><text x="664.00" y="455.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">et c'étaient les trois derniers</text><text x="664.00" y="469.50" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">: ceux de l'appareil, jamais de</text><text x="664.00" y="484.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">la matière.</text><text x="28.00" y="556.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">MESURÉ dans le code au 4 sept. 2026 · l'étalon vient d'une chaîne causale physique posée le 31 août 2026</text></svg>