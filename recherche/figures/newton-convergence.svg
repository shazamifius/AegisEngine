="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="start">pire cas</text><text x="664.00" y="176.00" font-family="sans-serif" font-size="19.0" fill="#7d4b2a" text-anchor="start" font-weight="600">× 15,7</text><text x="664.00" y="192.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">en quatre pas</text><text x="664.00" y="206.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="start">1,811° → 0,115°</text><text x="664.00" y="234.00" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">Le pire cas REMONTE au pas 1 :</text><text x="664.00" y="248.50" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">la sonde change de régime, elle</text><text x="664.00" y="263.00" font-family="sans-serif" font-size="10.5" fill="#8c3b2e" text-anchor="start">ne se dégrade pas.</text><text x="664.00" y="285.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">Ces rayons-là passent d'un côté</text><text x="664.00" y="300.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">à l'autre de l'angle critique,</text><text x="664.00" y="314.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">où la nature elle-même est</text><text x="664.00" y="329.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">discontinue.</text><text x="28.00" y="426.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">MESURÉ le 4 sept. 2026 · cargo test --release -p aegis_engine --lib newton_trouve_la_sortie -- --nocapture</text></svg>