<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img"><rect width="920" height="410" fill="#f4f1ea"/><text x="28.00" y="32.00" font-family="sans-serif" font-size="15.0" fill="#1a1815" text-anchor="start" font-weight="600">Ce que Newton coûte — en lectures de carte, pas en millisecondes</text><text x="28.00" y="52.00" font-family="sans-serif" font-size="11.5" fill="#9c9488" text-anchor="start">Une milliseconde ne se transpose pas d'une machine à l'autre ; un nombre de lectures, si.</text><line x1="82.00" y1="328.00" x2="602.00" y2="328.00" stroke="#ddd7cb" stroke-width="0.8" stroke-linecap="round"/><text x="74.00" y="332.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="end">0 %</text><line x1="82.00" y1="266.50" x2="602.00" y2="266.50" stroke="#ddd7cb" stroke-width="0.8" stroke-linecap="round"/><text x="74.00" y="270.50" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="end">15 %</text><line x1="82.00" y1="205.00" x2="602.00" y2="205.00" stroke="#ddd7cb" stroke-width="0.8" stroke-linecap="round"/><text x="74.00" y="209.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="end">30 %</text><line x1="82.00" y1="143.50" x2="602.00" y2="143.50" stroke="#ddd7cb" stroke-width="0.8" stroke-linecap="round"/><text x="74.00" y="147.50" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="end">45 %</text><line x1="82.00" y1="82.00" x2="602.00" y2="82.00" stroke="#ddd7cb" stroke-width="0.8" stroke-linecap="round"/><text x="74.00" y="86.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="end">60 %</text><line x1="132.32" y1="328.00" x2="132.32" y2="333.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="132.32" y="348.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">2</text><line x1="216.19" y1="328.00" x2="216.19" y2="333.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="216.19" y="348.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">3</text><line x1="300.06" y1="328.00" x2="300.06" y2="333.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="300.06" y="348.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">4</text><line x1="383.94" y1="328.00" x2="383.94" y2="333.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="383.94" y="348.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">5</text><line x1="467.81" y1="328.00" x2="467.81" y2="333.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="467.81" y="348.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">6</text><line x1="551.68" y1="328.00" x2="551.68" y2="333.00" stroke="#9c9488" stroke-width="1" stroke-linecap="round"/><text x="551.68" y="348.00" font-family="sans-serif" font-size="11.0" fill="#9c9488" text-anchor="middle">7</text><line x1="82.00" y1="328.00" x2="602.00" y2="328.00" stroke="#1a1815" stroke-width="1.2" stroke-linecap="round"/><line x1="82.00" y1="82.00" x2="82.00" y2="328.00" stroke="#1a1815" stroke-width="1.2" stroke-linecap="round"/><rect x="103.81" y="279.62" width="57.03" height="48.38" fill="#7d4b2a"/><text x="132.32" y="271.62" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="middle" font-weight="600">11,8 %</text><rect x="187.68" y="100.86" width="57.03" height="227.14" fill="#7d4b2a"/><text x="216.19" y="92.86" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="middle" font-weight="600">55,4 %</text><rect x="271.55" y="221.81" width="57.03" height="106.19" fill="#7d4b2a"/><text x="300.06" y="213.81" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="middle" font-weight="600">25,9 %</text><rect x="355.42" y="305.04" width="57.03" height="22.96" fill="#7d4b2a"/><text x="383.94" y="297.04" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="middle" font-weight="600">5,6 %</text><rect x="439.29" y="323.90" width="57.03" height="4.10" fill="#7d4b2a"/><text x="467.81" y="315.90" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="middle" font-weight="600">1,0 %</text><rect x="523.16" y="327.59" width="57.03" height="0.41" fill="#7d4b2a"/><text x="551.68" y="319.59" font-family="sans-serif" font-size="11.0" fill="#1a1815" text-anchor="middle" font-weight="600">0,1 %</text><line x1="239.68" y1="82.00" x2="239.68" y2="328.00" stroke="#2f5d62" stroke-width="1.6" stroke-dasharray="5 4"/><text x="247.68" y="98.00" font-family="sans-serif" font-size="11.0" fill="#2f5d62" text-anchor="start" font-weight="600">3,28 lectures en moyenne</text><text x="342.00" y="372.00" font-family="sans-serif" font-size="11.5" fill="#9c9488" text-anchor="middle">lectures de carte par pixel de verre</text><text x="664.00" y="104.00" font-family="sans-serif" font-size="19.0" fill="#7d4b2a" text-anchor="start" font-weight="600">100 280</text><text x="664.00" y="120.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">pixels de bille mesurés</text><text x="664.00" y="134.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="start">un gros plan, donc le pire cas</text><text x="664.00" y="162.00" font-family="sans-serif" font-size="19.0" fill="#7d4b2a" text-anchor="start" font-weight="600">97,3 %</text><text x="664.00" y="178.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">convergent d'eux-mêmes</text><text x="664.00" y="192.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="start">le budget de 8 pas ne les coupe pas</text><text x="664.00" y="220.00" font-family="sans-serif" font-size="19.0" fill="#7d4b2a" text-anchor="start" font-weight="600">1,735°</text><text x="664.00" y="236.00" font-family="sans-serif" font-size="10.5" fill="#1a1815" text-anchor="start">d'erreur atteinte</text><text x="664.00" y="250.00" font-family="sans-serif" font-size="9.5" fill="#9c9488" text-anchor="start">contre la vérité analytique</text><text x="664.00" y="272.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">Un budget de 8 pas ne veut pas</text><text x="664.00" y="286.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">dire 8 lectures : il dit AU PLUS</text><text x="664.00" y="301.00" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">8. C'est la distribution qui</text><text x="664.00" y="315.50" font-family="sans-serif" font-size="10.5" fill="#9c9488" text-anchor="start">décide du coût.</text><text x="28.00" y="396.00" font-family="sans-serif" font-size="10.0" fill="#9c9488" text-anchor="start">MESURÉ le 4 sept. 2026 · test le_cout_de_newton_se_compte_en_lectures_pas_en_millisecondes</text></svg>