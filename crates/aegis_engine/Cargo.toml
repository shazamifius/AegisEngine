[package]
name = "aegis_engine"
version = "0.1.0"
edition = "2021"
authors = ["Shaza"]
description = "Pure Vulkan 1.4 From Scratch 3D Engine for VR and Mobile"

[lib]
name = "aegis_engine"
path = "src/lib.rs"

[dependencies]
# Direct Vulkan 1.4 C API Bindings (Zero Middleware)
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"

# Windowing & Events
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

# Logging & Diagnostic
log = "0.4"
env_logger = "0.11"
serde_json = "1.0"

[build-dependencies]
# Pure-Rust Shader Compiler (WGSL -> Vulkan 1.4 SPIR-V)
naga = { version = "23.1", features = ["wgsl-in", "spv-out"] }
